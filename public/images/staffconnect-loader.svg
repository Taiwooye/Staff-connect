<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Loading StaffConnect">
  <style>
    /* StaffConnect loader: the house tile hops and tumbles a quarter turn per bounce. */
    .tile {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: tumble 2.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .heart {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: beat 0.6s ease-in-out infinite alternate;
    }
    .shadow {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: shadow 2.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .spark {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      opacity: 0;
      animation: spark 0.6s ease-out 0.5s infinite;
    }

    @keyframes tumble {
      0%     { transform: translateY(0)     scale(1, 1)       rotate(0deg); }
      3%     { transform: translateY(0)     scale(1.1, 0.88)  rotate(0deg); }
      12.5%  { transform: translateY(-34px) scale(0.96, 1.05) rotate(45deg); }
      21%    { transform: translateY(0)     scale(1, 1)       rotate(90deg); }
      23%    { transform: translateY(0)     scale(1.08, 0.9)  rotate(90deg); }
      25%    { transform: translateY(0)     scale(1, 1)       rotate(90deg); }
      28%    { transform: translateY(0)     scale(1.1, 0.88)  rotate(90deg); }
      37.5%  { transform: translateY(-34px) scale(0.96, 1.05) rotate(135deg); }
      46%    { transform: translateY(0)     scale(1, 1)       rotate(180deg); }
      48%    { transform: translateY(0)     scale(1.08, 0.9)  rotate(180deg); }
      50%    { transform: translateY(0)     scale(1, 1)       rotate(180deg); }
      53%    { transform: translateY(0)     scale(1.1, 0.88)  rotate(180deg); }
      62.5%  { transform: translateY(-34px) scale(0.96, 1.05) rotate(225deg); }
      71%    { transform: translateY(0)     scale(1, 1)       rotate(270deg); }
      73%    { transform: translateY(0)     scale(1.08, 0.9)  rotate(270deg); }
      75%    { transform: translateY(0)     scale(1, 1)       rotate(270deg); }
      78%    { transform: translateY(0)     scale(1.1, 0.88)  rotate(270deg); }
      87.5%  { transform: translateY(-34px) scale(0.96, 1.05) rotate(315deg); }
      96%    { transform: translateY(0)     scale(1, 1)       rotate(360deg); }
      98%    { transform: translateY(0)     scale(1.08, 0.9)  rotate(360deg); }
      100%   { transform: translateY(0)     scale(1, 1)       rotate(360deg); }
    }

    @keyframes shadow {
      0%, 21%, 25%, 46%, 50%, 71%, 75%, 96%, 100% { transform: scaleX(1);    opacity: 0.22; }
      12.5%, 37.5%, 62.5%, 87.5%                  { transform: scaleX(0.55); opacity: 0.1; }
    }

    @keyframes beat {
      from { transform: scale(0.9); }
      to   { transform: scale(1.12); }
    }

    @keyframes spark {
      0%   { opacity: 0; transform: translate(0, 0) scale(0.4); }
      15%  { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), -6px) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile, .shadow, .spark { animation: none; }
    }
  </style>

  <!-- ground shadow -->
  <ellipse class="shadow" cx="80" cy="134" rx="30" ry="5" fill="#142236" opacity="0.22" />

  <!-- little dust puffs when the tile lands -->
  <circle class="spark" cx="44" cy="128" r="3" fill="#f59e0b" style="--dx: -10px" />
  <circle class="spark" cx="116" cy="128" r="3" fill="#f59e0b" style="--dx: 10px" />

  <!-- the house tile -->
  <g class="tile">
    <rect x="46" y="62" width="68" height="68" rx="19" fill="#fbbf24" />
    <rect x="46" y="62" width="68" height="34" rx="19" fill="#ffffff" opacity="0.18" />
    <path d="M62.5 96 L80 80.5 L97.5 96 M67.5 91.5 V113 H92.5 V91.5"
          fill="none" stroke="#142236" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path class="heart"
          d="M80 109 C74.5 105 73 102 75.2 99.6 C77 97.7 79 98.3 80 100 C81 98.3 83 97.7 84.8 99.6 C87 102 85.5 105 80 109 Z"
          fill="#142236" />
  </g>
</svg>
